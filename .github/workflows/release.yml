name: Release the docker containers
on:
  workflow_dispatch:
    inputs:
      start_at:
        description: 'The first image to build. All images after it are built too.'
        type: choice
        options:
          - node
          - visualmetrics-deps
          - browsers
        default: node
  push:
    branches:
      - main
    paths:
      - 'docker-bake.hcl'
      - 'node/**'
      - 'visualmetrics-deps/**'
      - 'browsers/**'
concurrency:
  group: release
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.date.outputs.date }}
      start_at: ${{ steps.start_at.outputs.start_at }}
    steps:
      - name: Checkout
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      # A push to main starts at the first image that changed
      - name: Get the first image to build
        id: start_at
        env:
          INPUT_START_AT: ${{ inputs.start_at }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "start_at=$INPUT_START_AT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          variables=$(git diff -U0 "$BEFORE" "$GITHUB_SHA" -- docker-bake.hcl | grep -E '^[-+][^-+]' | grep -vE '_PUBLISHED_TAG|^[-+] *#' || true)
          start_at=
          if grep -q '^node/' <<< "$files" || grep -qE 'UBUNTU_|NODE_VERSION' <<< "$variables"; then
            start_at=node
          elif grep -q '^visualmetrics-deps/' <<< "$files" || grep -q 'FFMPEG_VERSION' <<< "$variables"; then
            start_at=visualmetrics-deps
          elif grep -q '^browsers/' <<< "$files" || grep -qE '(CHROME|FIREFOX|EDGE)_VERSION' <<< "$variables"; then
            start_at=browsers
          elif [ -n "$variables" ]; then
            start_at=node
          fi
          echo "start_at=$start_at" >> "$GITHUB_OUTPUT"

      # Get the date one time so that all platforms get the same tag
      - name: Get the date
        id: date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    if: ${{ needs.prepare.outputs.start_at != '' }}
    runs-on: ${{ matrix.runner }}
    env:
      DATE: ${{ needs.prepare.outputs.date }}
      START_AT: ${{ needs.prepare.outputs.start_at }}
      PUSH_BY_DIGEST: true
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Login to DockerHub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        run: docker buildx bake --provenance=false --set "*.platform=${{ matrix.platform }}" --metadata-file metadata.json "from-$START_AT"

      - name: Upload the digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: metadata-${{ matrix.arch }}
          path: metadata.json

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      webbrowsers_tag: ${{ steps.tag.outputs.webbrowsers_tag }}
    env:
      DATE: ${{ needs.prepare.outputs.date }}
      START_AT: ${{ needs.prepare.outputs.start_at }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Login to DockerHub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download the digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: metadata-*
          path: metadata

      - name: Tag the multi-platform images
        id: tag
        run: |
          echo "## Published images" >> "$GITHUB_STEP_SUMMARY"
          docker buildx bake --print "from-$START_AT" | jq -r '.target | to_entries[] | "\(.key) \(.value.tags[0])"' |
          while read -r target image; do
            repository=${image%:*}
            mapfile -t sources < <(jq -r --arg target "$target" --arg repository "$repository" '"\($repository)@\(.[$target]["containerimage.digest"])"' metadata/*/metadata.json)
            docker buildx imagetools create -t "$image" "${sources[@]}"
            variable="$(echo "$target" | tr 'a-z-' 'A-Z_')_PUBLISHED_TAG"
            sed -i "s|^variable \"$variable\" { default = \".*\" }$|variable \"$variable\" { default = \"${image#*:}\" }|" docker-bake.hcl
            echo "- \`$image\`" >> "$GITHUB_STEP_SUMMARY"
            if [ "$target" = browsers ]; then
              echo "webbrowsers_tag=${image#*:}" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Save the published tags
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Published images $DATE"
          git push

  # Open a pull request in each project that uses the new browsers image.
  # The project's own CI tests it and a maintainer merges it.
  update-dockerfiles:
    needs: publish
    if: ${{ needs.publish.outputs.webbrowsers_tag != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repository: [sitespeed.io, browsertime]
    env:
      BRANCH: update-webbrowsers
      TAG: ${{ needs.publish.outputs.webbrowsers_tag }}
    steps:
      - name: Get a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repository }}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repository }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_USER: ${{ steps.app-token.outputs.app-slug }}[bot]
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          sed -i "s|^FROM sitespeedio/webbrowsers:.*$|FROM sitespeedio/webbrowsers:$TAG|" Dockerfile
          git diff --quiet Dockerfile && exit 0
          git config user.name "$APP_USER"
          git config user.email "$(gh api "/users/$APP_USER" --jq .id)+$APP_USER@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -m "Use sitespeedio/webbrowsers:$TAG" Dockerfile
          git push -f origin "$BRANCH"
          title="Use sitespeedio/webbrowsers:$TAG"
          body="The [release of the Docker base images]($RUN_URL) published \`sitespeedio/webbrowsers:$TAG\`."
          if [ "$(gh pr view "$BRANCH" --json state -q .state 2>/dev/null)" = OPEN ]; then
            gh pr edit "$BRANCH" --title "$title" --body "$body"
          else
            gh pr create --head "$BRANCH" --title "$title" --body "$body"
          fi
