name: Build the docker containers
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    if: ${{ !contains(github.event.head_commit.message, 'docs:') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Build the images
        run: docker buildx bake --load --set "*.platform=${{ matrix.platform }}" --set browsers.tags=sitespeedio/webbrowsers:test

      - name: Check the tools in the browsers image
        run: docker run --rm sitespeedio/webbrowsers:test bash -c 'node --version && ffmpeg -version | head -1 && python --version && google-chrome --version && firefox --version'

      # A browser can report its version but still fail to start, so test with a real run
      - name: Checkout sitespeed.io
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: sitespeedio/sitespeed.io
          path: sitespeed.io

      # Use the new browsers image for the image name in the sitespeed.io FROM line
      - name: Build sitespeed.io on the browsers image
        working-directory: sitespeed.io
        run: |
          docker tag sitespeedio/webbrowsers:test "$(sed -n 's/^FROM //p' Dockerfile)"
          docker buildx build --builder default --load --platform ${{ matrix.platform }} -t sitespeedio/sitespeed.io:test .

      - name: Test sitespeed.io
        working-directory: sitespeed.io
        env:
          BROWSERS: ${{ matrix.platform == 'linux/amd64' && 'chrome firefox edge' || 'chrome firefox' }}
        run: |
          run() {
            local name=$1
            shift
            docker run --rm -v "$(pwd)":/sitespeed.io "$@" --outputFolder "/sitespeed.io/results/$name"
            grep -rq '"SpeedIndex"' "results/$name"
          }
          docker run -d --network host -v "$(pwd)/test/data/html:/html:ro" sitespeedio/webbrowsers:test python3 -m http.server 3001 -d /html
          for browser in $BROWSERS; do
            run "$browser" --network=host sitespeedio/sitespeed.io:test http://127.0.0.1:3001 -n 1 -b "$browser"
          done
          run chrome-config --network=host sitespeedio/sitespeed.io:test http://127.0.0.1:3001 -b chrome --config test/exampleConfig.json
          run wpr-chrome --cap-add=NET_ADMIN -e REPLAY=true -e LATENCY=100 sitespeedio/sitespeed.io:test https://www.sitespeed.io -n 3 -b chrome
          run wpr-firefox --cap-add=NET_ADMIN --network=host -e REPLAY=true -e LATENCY=100 sitespeedio/sitespeed.io:test https://www.sitespeed.io -n 3 -b firefox --browsertime.firefox.acceptInsecureCerts true

      # The browsers image has the layers of all the images
      - name: Run Trivy vulnerability scanner
        if: ${{ matrix.platform == 'linux/amd64' }}
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # master
        with:
          image-ref: 'sitespeedio/webbrowsers:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

  # Merge the "Update versions" pull request when the build and the tests pass on both
  # platforms. The merge is made by the GitHub App so that it starts the Release workflow.
  merge:
    needs: build
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'update-versions' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    steps:
      - name: Get a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Only merge the commit that was tested
      - name: Merge the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --merge --match-head-commit "$HEAD_SHA"
